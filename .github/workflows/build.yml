name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'     
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip libsqlite3-dev
          pip install buildozer cython
          pip install git+https://github.com/kivy/python-for-android.git
      - name: setup android sdk
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk
          cd $HOME/.buildozer/android/platform
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-11076708_latest.zip
          mkdir -p android-sdk/cmdline-tools/latest
          mv cmdline-tools/* android-sdk/cmdline-tools/latest/
          yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        env:
          ANDROID_SDK_ROOT: $HOME/.buildozer/android/platform/android-sdk
      - name: Build APK
        run: buildozer -v android debug 
        env:
          ANDROID_SDK_ROOT: $HOME/.buildozer/android/platform/android-sdk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wilobi-apk
          path: bin/*.apk
